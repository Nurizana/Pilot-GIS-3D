<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D TIF Viewer - Pilot GIS</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; color: white; font-family: sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; top: 15px; left: 15px; background: rgba(0, 0, 0, 0.8); padding: 15px; border-radius: 8px; z-index: 100; min-width: 200px; }
        select, button { padding: 8px; margin-top: 10px; width: 100%; cursor: pointer; }
        #loading { display: none; color: #ffeb3b; margin-top: 10px; font-weight: bold; }
    </style>
    <!-- Import GeoTIFF.js -->
    <script src="https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.min.js"></script>
    
    <!-- Fix for the Three.js Import Error -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ui">
        <h2>3D Terrain Viewer</h2>
        <label for="layerSelect">Select TIF Layer:</label>
        <select id="layerSelect">
            <!-- The Javascript below will auto-fill this dropdown -->
        </select>
        <button id="loadBtn">Load 3D Surface</button>
        <div id="loading">Processing TIF data...</div>
    </div>
    
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- 1. SETUP THE LIST OF FILES ---
        // You must add all 200 of your filenames here manually.
        const myTifFiles = [
            "AU13001.tif",
            "AU13002.tif",
            "AU13003.tif",
            "AU13004.tif",
            "AU13011.tif"
        ];

        const selectElement = document.getElementById('layerSelect');
        myTifFiles.forEach(file => {
            let option = document.createElement('option');
            option.value = `Data/${file}`;
            option.text = file;
            selectElement.appendChild(option);
        });

        // --- 2. SETUP SCENE, CAMERA, LIGHTING ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Sky color

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 10000);
        camera.position.set(0, 800, 800);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(500, 1000, 500);
        scene.add(directionalLight);

        // --- 3. ADD ESRI BLUE OCEAN BASEMAP PLANE ---
        const oceanGeometry = new THREE.PlaneGeometry(10000, 10000);
        const oceanMaterial = new THREE.MeshBasicMaterial({ color: 0x006994, side: THREE.DoubleSide }); // ESRI Ocean Blue
        const ocean = new THREE.Mesh(oceanGeometry, oceanMaterial);
        ocean.rotation.x = -Math.PI / 2;
        ocean.position.y = -10; // Sit just below the terrain
        scene.add(ocean);

        let currentMesh = null;

        // --- 4. TIF PROCESSING & COLOR RAMP ---
        async function loadSelectedTIF() {
            const filepath = document.getElementById('layerSelect').value;
            const loadingText = document.getElementById('loading');
            loadingText.style.display = 'block';

            try {
                if (currentMesh) {
                    scene.remove(currentMesh);
                    currentMesh.geometry.dispose();
                    currentMesh.material.dispose();
                }

                const response = await fetch(filepath);
                const arrayBuffer = await response.arrayBuffer();
                const tiff = await GeoTIFF.fromArrayBuffer(arrayBuffer);
                const image = await tiff.getImage();
                const rasters = await image.readRasters();
                const elevationData = rasters[0]; 

                const width = image.getWidth();
                const height = image.getHeight();

                const geometry = new THREE.PlaneGeometry(width, height, width - 1, height - 1);
                const vertices = geometry.attributes.position.array;

                // Find Min and Max elevation for the color ramp
                let minZ = Infinity;
                let maxZ = -Infinity;
                for (let i = 0; i < elevationData.length; i++) {
                    let e = elevationData[i];
                    if (e > -1000) { 
                        if (e < minZ) minZ = e;
                        if (e > maxZ) maxZ = e;
                    }
                }

                const colors = [];
                const color = new THREE.Color();

                for (let i = 0, j = 0; i < vertices.length; i += 3, j++) {
                    let elevation = elevationData[j];
                    if (elevation < -1000) elevation = minZ; // Flatten NoData
                    
                    vertices[i + 2] = elevation; 

                    // Create Color Ramp (Green to Yellow to Red)
                    let normalizedHeight = (elevation - minZ) / (maxZ - minZ);
                    if (isNaN(normalizedHeight)) normalizedHeight = 0;
                    
                    // HSL Colors: 0.3 is Green, 0.0 is Red
                    color.setHSL((1.0 - normalizedHeight) * 0.3, 1.0, 0.5); 
                    colors.push(color.r, color.g, color.b);
                }

                geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
                geometry.computeVertexNormals(); 

                // Use vertexColors instead of a solid green
                const material = new THREE.MeshStandardMaterial({ 
                    vertexColors: true, 
                    wireframe: false,
                    side: THREE.DoubleSide
                });

                currentMesh = new THREE.Mesh(geometry, material);
                currentMesh.rotation.x = -Math.PI / 2;
                scene.add(currentMesh);
                
                loadingText.style.display = 'none';
            } catch (error) {
                console.error("Error loading TIF:", error);
                loadingText.innerText = "Error loading file. Check console.";
            }
        }

        // Attach event listener (Fixes the ReferenceError)
        document.getElementById('loadBtn').addEventListener('click', loadSelectedTIF);

        // --- 5. ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
