<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D DEM - Pilot GIS</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; color: white; font-family: sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; top: 15px; left: 15px; background: rgba(0, 0, 0, 0.8); padding: 15px; border-radius: 8px; z-index: 100; min-width: 250px; max-height: 90vh; display: flex; flex-direction: column; }
        select { padding: 8px; margin-top: 10px; width: 100%; height: 250px; cursor: pointer; background: #333; color: white; border: 1px solid #555; }
        button { padding: 12px; margin-top: 15px; width: 100%; cursor: pointer; background: #4caf50; color: white; border: none; font-weight: bold; font-size: 14px; }
        button:hover { background: #45a049; }
        #loading { display: none; color: #ffeb3b; margin-top: 15px; font-weight: bold; text-align: center; }
        small { color: #bbb; display: block; margin-top: 5px; font-size: 11px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.min.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ui">
        <h2>3D DEM Viewer</h2>
        <label for="layerSelect">Select TIF Layers:</label>
        <small>Hold <b>Ctrl</b> (Windows) or <b>Cmd</b> (Mac) to select multiple.</small>
        <select id="layerSelect" multiple>
            <!-- Javascript will auto-fill this -->
        </select>
        <button id="loadBtn">Load 3D Surface</button>
        <div id="loading">Processing TIF data...</div>
    </div>
    
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Add all your 200 filenames here (shortened for brevity)
        const myTifFiles = [
            "AU13002.tif", "AU13003.tif", "AU13004.tif", "AU13011.tif", "AU13012.tif", 
            "AU13013.tif", "AU13014.tif", "AU13021.tif", "AU13022.tif", "AU13023.tif",
            "AU13024.tif", "AU13031.tif", "AU13032.tif", "AU13033.tif", "AU13034.tif"
        ];

        const selectElement = document.getElementById('layerSelect');
        myTifFiles.forEach(file => {
            let option = document.createElement('option');
            option.value = `Data/${file}`;
            option.text = file;
            selectElement.appendChild(option);
        });

        // 1. SCENE SETUP
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); 

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100000);
        camera.position.set(0, 3000, 4000);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(2000, 5000, 2000);
        scene.add(directionalLight);

        // 2. REFERENCE GRID & SATELLITE BASEMAP
        // Add a visible grid to give scale (Size: 20000 meters, 100 divisions)
        const gridHelper = new THREE.GridHelper(20000, 100, 0xffffff, 0x555555);
        gridHelper.position.y = -5; // Sit just below the models
        scene.add(gridHelper);

        // Prepare the Satellite Basemap Plane
        const textureLoader = new THREE.TextureLoader();
        // It will look for your exported image in the Data folder
        const basemapTexture = textureLoader.load('Data/satellite_base.jpg', 
            function (texture) { console.log("Basemap loaded successfully"); },
            undefined,
            function (err) { console.warn("No satellite_base.jpg found yet. Showing default color."); }
        );

        // Make the plane large enough to cover the grid (20km x 20km)
        const basePlaneGeom = new THREE.PlaneGeometry(20000, 20000);
        const basePlaneMat = new THREE.MeshBasicMaterial({ 
            map: basemapTexture, 
            color: 0x222222, // Dark grey fallback if image isn't found
            side: THREE.DoubleSide 
        }); 
        
        const basePlane = new THREE.Mesh(basePlaneGeom, basePlaneMat);
        basePlane.rotation.x = -Math.PI / 2;
        basePlane.position.y = -10; 
        scene.add(basePlane);

        let currentMeshes = [];

        // 3. LAYER LOADING LOGIC
        async function loadSelectedTIF() {
            const selectedOptions = Array.from(document.getElementById('layerSelect').selectedOptions).map(opt => opt.value);
            if (selectedOptions.length === 0) return;
            if (selectedOptions.length > 20) {
                alert("Please select a maximum of 20 layers.");
                selectedOptions.length = 20; 
            }

            const loadingText = document.getElementById('loading');
            loadingText.style.display = 'block';
            loadingText.innerText = `Processing ${selectedOptions.length} layer(s)...`;

            try {
                currentMeshes.forEach(mesh => { scene.remove(mesh); mesh.geometry.dispose(); mesh.material.dispose(); });
                currentMeshes = [];

                let loadedTiles = [];
                let globalMinZ = Infinity;
                let globalMaxZ = -Infinity;
                let globalOffsetX = null;
                let globalOffsetY = null;

                for (let k = 0; k < selectedOptions.length; k++) {
                    const response = await fetch(selectedOptions[k]);
                    const arrayBuffer = await response.arrayBuffer();
                    const tiff = await GeoTIFF.fromArrayBuffer(arrayBuffer);
                    const image = await tiff.getImage();
                    const rasters = await image.readRasters();
                    const elevationData = rasters[0]; 

                    const width = image.getWidth();
                    const height = image.getHeight();
                    const tiepoints = image.getTiePoints();
                    const pixelScale = image.getFileDirectory().ModelPixelScale;
                    
                    let originX = 0, originY = 0, scaleX = 1, scaleY = 1;
                    if (tiepoints && tiepoints.length > 0 && pixelScale) {
                        originX = tiepoints[0].x;
                        originY = tiepoints[0].y;
                        scaleX = pixelScale[0];
                        scaleY = pixelScale[1];
                    }

                    if (globalOffsetX === null) {
                        globalOffsetX = originX;
                        globalOffsetY = originY;
                    }

                    for (let i = 0; i < elevationData.length; i++) {
                        let e = elevationData[i];
                        if (e > -1000) { 
                            if (e < globalMinZ) globalMinZ = e;
                            if (e > globalMaxZ) globalMaxZ = e;
                        }
                    }

                    loadedTiles.push({ elevationData, width, height, originX, originY, scaleX, scaleY });
                }

                for (let k = 0; k < loadedTiles.length; k++) {
                    const tile = loadedTiles[k];
                    const geometry = new THREE.PlaneGeometry(tile.width, tile.height, tile.width - 1, tile.height - 1);
                    const vertices = geometry.attributes.position.array;
                    
                    const colors = [];
                    const color = new THREE.Color();

                    for (let i = 0, j = 0; i < vertices.length; i += 3, j++) {
                        let elevation = tile.elevationData[j];
                        if (elevation < -1000) elevation = globalMinZ; 
                        vertices[i + 2] = elevation; 

                        let normalizedHeight = (elevation - globalMinZ) / (globalMaxZ - globalMinZ);
                        if (isNaN(normalizedHeight)) normalizedHeight = 0;
                        color.setHSL((1.0 - normalizedHeight) * 0.3, 1.0, 0.5); 
                        colors.push(color.r, color.g, color.b);
                    }

                    geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
                    geometry.computeVertexNormals(); 

                    const material = new THREE.MeshStandardMaterial({ vertexColors: true, wireframe: false, side: THREE.DoubleSide });
                    const mesh = new THREE.Mesh(geometry, material);
                    mesh.rotation.x = -Math.PI / 2;

                    const offsetX = (tile.originX - globalOffsetX) / tile.scaleX;
                    const offsetY = (tile.originY - globalOffsetY) / tile.scaleY;
                    
                    mesh.position.x = offsetX + (tile.width / 2);
                    mesh.position.z = -offsetY + (tile.height / 2); 

                    scene.add(mesh);
                    currentMeshes.push(mesh);
                }
                
                loadingText.style.display = 'none';
            } catch (error) {
                console.error("Error loading TIF:", error);
                loadingText.innerText = "Error loading file. Check console.";
            }
        }

        document.getElementById('loadBtn').addEventListener('click', loadSelectedTIF);

        function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
        animate();

        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    </script>
</body>
</html>
