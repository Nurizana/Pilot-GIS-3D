<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D DEM - Pilot GIS</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; color: white; font-family: sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; top: 15px; left: 15px; background: rgba(0, 0, 0, 0.8); padding: 15px; border-radius: 8px; z-index: 100; min-width: 200px; max-height: 90vh; overflow-y: auto; }
        select, button { padding: 8px; margin-top: 10px; width: 100%; cursor: pointer; }
        #loading { display: none; color: #ffeb3b; margin-top: 10px; font-weight: bold; }
    </style>
    <!-- Import GeoTIFF.js -->
    <script src="https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.min.js"></script>
    
    <!-- Import Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ui">
        <h2>3D DEM</h2>
        <label for="layerSelect">Select TIF Layer:</label>
        <select id="layerSelect">
            <!-- JavaScript will auto-fill this -->
        </select>
        <button id="loadBtn">Load 3D Surface</button>
        <div id="loading">Processing TIF data...</div>
    </div>
    
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- 1. SETUP THE LIST OF FILES ---
        // Complete list extracted from all provided screenshots
        const myTifFiles = [
            "AU13002.tif", "AU13003.tif", "AU13004.tif", "AU13011.tif", "AU13012.tif", "AU13013.tif", "AU13014.tif",
            "AU13021.tif", "AU13022.tif", "AU13023.tif", "AU13024.tif", "AU13031.tif", "AU13032.tif", "AU13033.tif",
            "AU13034.tif", "AU13041.tif", "AU13042.tif", "AU13043.tif", "AU13044.tif", "AU13051.tif", "AU13052.tif",
            "AU13053.tif", "AU13054.tif", "AU13061.tif", "AU13062.tif", "AU13063.tif", "AU13064.tif", "AU13071.tif",
            "AU13072.tif", "AU13073.tif", "AU13074.tif", "AU13081.tif", "AU13082.tif", "AU13083.tif", "AU13084.tif",
            "AU13091.tif", "AU13092.tif", "AU13093.tif", "AU13094.tif", "AU13101.tif", "AU13102.tif", "AU13103.tif",
            "AU13104.tif", "AU13111.tif", "AU13112.tif", "AU13113.tif", "AU13114.tif", "AU13121.tif", "AU13122.tif",
            "AU13123.tif", "AU13124.tif", "AU13131.tif", "AU13132.tif", "AU13133.tif", "AU13134.tif", "AU13141.tif",
            "AU13142.tif", "AU13143.tif", "AU13144.tif", "AU13151.tif", "AU13152.tif", "AU13153.tif", "AU13154.tif",
            "AU13161.tif", "AU13162.tif", "AU13163.tif", "AU13164.tif", "AU13171.tif", "AU13172.tif", "AU13173.tif",
            "AU13174.tif", "AU13181.tif", "AU13182.tif", "AU13183.tif", "AU13184.tif", "AU13191.tif", "AU13192.tif",
            "AU13193.tif", "AU13194.tif", "AU13201.tif", "AU13202.tif", "AU13203.tif", "AU13204.tif", "AU13211.tif",
            "AU13212.tif", "AU13213.tif", "AU13214.tif", "AU13221.tif", "AU13222.tif", "AU13223.tif", "AU13224.tif",
            "AU13231.tif", "AU13232.tif", "AU13233.tif", "AU13234.tif", "AU13241.tif", "AU13242.tif", "AU13243.tif",
            "AU13244.tif", "AU31001.tif", "AU31002.tif", "AU31003.tif", "AU31004.tif", "AU31011.tif", "AU31012.tif",
            "AU31013.tif", "AU31014.tif", "AU31021.tif", "AU31022.tif", "AU31023.tif", "AU31024.tif", "AU31031.tif",
            "AU31032.tif", "AU31033.tif", "AU31034.tif", "AU31041.tif", "AU31042.tif", "AU31043.tif", "AU31044.tif",
            "AU31051.tif", "AU31052.tif", "AU31053.tif", "AU31054.tif", "AU31061.tif", "AU31062.tif", "AU31063.tif",
            "AU31064.tif", "AU31071.tif", "AU31072.tif", "AU31073.tif", "AU31074.tif", "AU31081.tif", "AU31082.tif",
            "AU31083.tif", "AU31084.tif", "AU31091.tif", "AU31092.tif", "AU31093.tif", "AU31094.tif", "AU31101.tif",
            "AU31102.tif", "AU31103.tif", "AU31104.tif", "AU31111.tif", "AU31112.tif", "AU31123.tif", "AU31124.tif",
            "AU31131.tif", "AU31132.tif", "AU31133.tif", "AU31134.tif", "AU31141.tif", "AU31142.tif", "AU31143.tif",
            "AU31144.tif", "AU31151.tif", "AU31152.tif", "AU31153.tif", "AU31154.tif", "AU31161.tif", "AU31162.tif",
            "AU31163.tif", "AU31164.tif", "AU31171.tif", "AU31172.tif", "AU31173.tif", "AU31174.tif", "AU31181.tif",
            "AU31182.tif", "AU31183.tif", "AU31184.tif", "AU31191.tif", "AU31192.tif", "AU31193.tif", "AU31194.tif",
            "AU31201.tif", "AU31202.tif", "AU31203.tif", "AU31204.tif", "AU31211.tif", "AU31212.tif", "AU31213.tif",
            "AU31214.tif", "AU31221.tif", "AU31222.tif", "AU31223.tif", "AU31224.tif", "AU31231.tif", "AU31232.tif",
            "AU31233.tif", "AU31234.tif", "AU31241.tif", "AU31242.tif", "AU31243.tif", "AU31244.tif"
        ];

        const selectElement = document.getElementById('layerSelect');
        myTifFiles.forEach(file => {
            let option = document.createElement('option');
            option.value = `Data/${file}`;
            option.text = file;
            selectElement.appendChild(option);
        });

        // --- 2. SETUP SCENE, CAMERA, LIGHTING ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); 

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 10000);
        camera.position.set(0, 800, 800);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(500, 1000, 500);
        scene.add(directionalLight);

        // --- 3. ADD ESRI BLUE OCEAN BASEMAP PLANE ---
        const oceanGeometry = new THREE.PlaneGeometry(10000, 10000);
        const oceanMaterial = new THREE.MeshBasicMaterial({ color: 0x006994, side: THREE.DoubleSide }); 
        const ocean = new THREE.Mesh(oceanGeometry, oceanMaterial);
        ocean.rotation.x = -Math.PI / 2;
        ocean.position.y = -10; 
        scene.add(ocean);

        let currentMesh = null;

        // --- 4. TIF PROCESSING & COLOR RAMP ---
        async function loadSelectedTIF() {
            const filepath = document.getElementById('layerSelect').value;
            const loadingText = document.getElementById('loading');
            loadingText.style.display = 'block';

            try {
                if (currentMesh) {
                    scene.remove(currentMesh);
                    currentMesh.geometry.dispose();
                    currentMesh.material.dispose();
                }

                const response = await fetch(filepath);
                const arrayBuffer = await response.arrayBuffer();
                const tiff = await GeoTIFF.fromArrayBuffer(arrayBuffer);
                const image = await tiff.getImage();
                const rasters = await image.readRasters();
                const elevationData = rasters[0]; 

                const width = image.getWidth();
                const height = image.getHeight();

                const geometry = new THREE.PlaneGeometry(width, height, width - 1, height - 1);
                const vertices = geometry.attributes.position.array;

                let minZ = Infinity;
                let maxZ = -Infinity;
                for (let i = 0; i < elevationData.length; i++) {
                    let e = elevationData[i];
                    if (e > -1000) { 
                        if (e < minZ) minZ = e;
                        if (e > maxZ) maxZ = e;
                    }
                }

                const colors = [];
                const color = new THREE.Color();

                for (let i = 0, j = 0; i < vertices.length; i += 3, j++) {
                    let elevation = elevationData[j];
                    if (elevation < -1000) elevation = minZ; 
                    
                    vertices[i + 2] = elevation; 

                    let normalizedHeight = (elevation - minZ) / (maxZ - minZ);
                    if (isNaN(normalizedHeight)) normalizedHeight = 0;
                    
                    color.setHSL((1.0 - normalizedHeight) * 0.3, 1.0, 0.5); 
                    colors.push(color.r, color.g, color.b);
                }

                geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
                geometry.computeVertexNormals(); 

                const material = new THREE.MeshStandardMaterial({ 
                    vertexColors: true, 
                    wireframe: false,
                    side: THREE.DoubleSide
                });

                currentMesh = new THREE.Mesh(geometry, material);
                currentMesh.rotation.x = -Math.PI / 2;
                scene.add(currentMesh);
                
                loadingText.style.display = 'none';
            } catch (error) {
                console.error("Error loading TIF:", error);
                loadingText.innerText = "Error loading file. Check console.";
            }
        }

        document.getElementById('loadBtn').addEventListener('click', loadSelectedTIF);

        // --- 5. ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
