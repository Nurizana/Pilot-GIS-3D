<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D DEM - Pilot GIS</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; color: white; font-family: sans-serif; }
        canvas { display: block; }
        
        /* Main UI Panel */
        #ui { 
            position: absolute; top: 15px; left: 15px; 
            background: rgba(18, 24, 38, 0.9); 
            padding: 18px; border-radius: 10px; z-index: 100; 
            width: 280px; max-height: 88vh; 
            display: flex; flex-direction: column; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.1);
        }
        h2 { margin: 0 0 10px 0; font-size: 20px; color: #4caf50; }
        
        /* Section Containers */
        .section-box {
            background: rgba(255,255,255,0.05);
            padding: 10px; border-radius: 6px;
            margin-bottom: 12px;
        }
        
        /* Basemap Control Button */
        .toggle-btn {
            padding: 10px; width: 100%; cursor: pointer;
            background: #2196F3; color: white; border: none;
            border-radius: 5px; font-weight: bold; font-size: 13px;
            transition: background 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .toggle-btn.off { background: #555; }
        .toggle-btn:hover { opacity: 0.9; }

        /* DEM Layer List Box */
        .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .counter { font-size: 12px; font-weight: bold; color: #ffeb3b; }
        
        #demListContainer {
            height: 220px; overflow-y: auto;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid #444; border-radius: 4px;
            padding: 6px;
        }
        
        .dem-item {
            display: flex; align-items: center;
            padding: 4px 6px; font-size: 13px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
        }
        .dem-item:hover { background: rgba(255,255,255,0.1); }
        .dem-item input { margin-right: 8px; cursor: pointer; }

        /* Main Action Button */
        #loadBtn {
            padding: 12px; margin-top: 8px; width: 100%; cursor: pointer;
            background: #4caf50; color: white; border: none;
            border-radius: 6px; font-weight: bold; font-size: 14px;
            box-shadow: 0 4px 10px rgba(76, 175, 80, 0.4);
        }
        #loadBtn:hover { background: #45a049; }
        #loading { display: none; color: #ffeb3b; margin-top: 10px; font-weight: bold; text-align: center; font-size: 12px; }

        /* Elevation Legend */
        #legend { 
            position: absolute; bottom: 20px; right: 20px; 
            background: rgba(18, 24, 38, 0.9); padding: 14px; 
            border-radius: 8px; display: none; text-align: center; 
            border: 1px solid rgba(255,255,255,0.1);
        }
        #legend h4 { margin: 0 0 10px 0; font-size: 12px; letter-spacing: 1px; color: #aaa; }
        .legend-container { display: flex; align-items: center; justify-content: center; height: 130px; }
        .color-bar { height: 100%; width: 20px; background: linear-gradient(to top, #4caf50, #ffff00, #ff5252); border-radius: 3px; margin-right: 12px; }
        .labels { display: flex; flex-direction: column; justify-content: space-between; height: 100%; font-size: 12px; font-weight: bold; }
    </style>
    
    <script src="https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.min.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ui">
        <h2>3D DEM Viewer</h2>
        
        <!-- BASEMAP CONTROL -->
        <div class="section-box">
            <button id="basemapBtn" class="toggle-btn">
                <span>🛰️ Satellite Basemap (MY)</span>
            </button>
        </div>

        <!-- DEM LAYERS SELECTION -->
        <div class="section-box" style="flex-grow: 1; display: flex; flex-direction: column;">
            <div class="list-header">
                <label style="font-weight: bold; font-size: 13px;">DEM Layers:</label>
                <span class="counter" id="selectCount">0 / 20 Selected</span>
            </div>
            
            <div id="demListContainer">
                <!-- Checkboxes injected by JS -->
            </div>
        </div>

        <button id="loadBtn">Render 3D Terrain</button>
        <div id="loading">Processing DEM files & Satellite...</div>
    </div>

    <!-- ELEVATION LEGEND -->
    <div id="legend">
        <h4>ELEVATION</h4>
        <div class="legend-container">
            <div class="color-bar"></div>
            <div class="labels">
                <span id="maxElev">0 m</span>
                <span id="minElev">0 m</span>
            </div>
        </div>
    </div>
    
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- ALL TIF FILES LIST ---
        const myTifFiles = [
            "AU13002.tif", "AU13003.tif", "AU13004.tif", "AU13011.tif", "AU13012.tif", "AU13013.tif", "AU13014.tif",
            "AU13021.tif", "AU13022.tif", "AU13023.tif", "AU13024.tif", "AU13031.tif", "AU13032.tif", "AU13033.tif",
            "AU13034.tif", "AU13041.tif", "AU13042.tif", "AU13043.tif", "AU13044.tif", "AU13051.tif", "AU13052.tif",
            "AU13053.tif", "AU13054.tif", "AU13061.tif", "AU13062.tif", "AU13063.tif", "AU13064.tif", "AU13071.tif",
            "AU13072.tif", "AU13073.tif", "AU13074.tif", "AU13081.tif", "AU13082.tif", "AU13083.tif", "AU13084.tif",
            "AU13091.tif", "AU13092.tif", "AU13093.tif", "AU13094.tif", "AU13101.tif", "AU13102.tif", "AU13103.tif",
            "AU13104.tif", "AU13111.tif", "AU13112.tif", "AU13113.tif", "AU13114.tif", "AU13121.tif", "AU13122.tif",
            "AU13123.tif", "AU13124.tif", "AU13131.tif", "AU13132.tif", "AU13133.tif", "AU13134.tif", "AU13141.tif",
            "AU13142.tif", "AU13143.tif", "AU13144.tif", "AU13151.tif", "AU13152.tif", "AU13153.tif", "AU13154.tif",
            "AU13161.tif", "AU13162.tif", "AU13163.tif", "AU13164.tif", "AU13171.tif", "AU13172.tif", "AU13173.tif",
            "AU13174.tif", "AU13181.tif", "AU13182.tif", "AU13183.tif", "AU13184.tif", "AU13191.tif", "AU13192.tif",
            "AU13193.tif", "AU13194.tif", "AU13201.tif", "AU13202.tif", "AU13203.tif", "AU13204.tif", "AU13211.tif",
            "AU13212.tif", "AU13213.tif", "AU13214.tif", "AU13221.tif", "AU13222.tif", "AU13223.tif", "AU13224.tif",
            "AU13231.tif", "AU13232.tif", "AU13233.tif", "AU13234.tif", "AU13241.tif", "AU13242.tif", "AU13243.tif",
            "AU13244.tif", "AU31001.tif", "AU31002.tif", "AU31003.tif", "AU31004.tif", "AU31011.tif", "AU31012.tif",
            "AU31013.tif", "AU31014.tif", "AU31021.tif", "AU31022.tif", "AU31023.tif", "AU31024.tif", "AU31031.tif",
            "AU31032.tif", "AU31033.tif", "AU31034.tif", "AU31041.tif", "AU31042.tif", "AU31043.tif", "AU31044.tif",
            "AU31051.tif", "AU31052.tif", "AU31053.tif", "AU31054.tif", "AU31061.tif", "AU31062.tif", "AU31063.tif",
            "AU31064.tif", "AU31071.tif", "AU31072.tif", "AU31073.tif", "AU31074.tif", "AU31081.tif", "AU31082.tif",
            "AU31083.tif", "AU31084.tif", "AU31091.tif", "AU31092.tif", "AU31093.tif", "AU31094.tif", "AU31101.tif",
            "AU31102.tif", "AU31103.tif", "AU31104.tif", "AU31111.tif", "AU31112.tif", "AU31123.tif", "AU31124.tif",
            "AU31131.tif", "AU31132.tif", "AU31133.tif", "AU31134.tif", "AU31141.tif", "AU31142.tif", "AU31143.tif",
            "AU31144.tif", "AU31151.tif", "AU31152.tif", "AU31153.tif", "AU31154.tif", "AU31161.tif", "AU31162.tif",
            "AU31163.tif", "AU31164.tif", "AU31171.tif", "AU31172.tif", "AU31173.tif", "AU31174.tif", "AU31181.tif",
            "AU31182.tif", "AU31183.tif", "AU31184.tif", "AU31191.tif", "AU31192.tif", "AU31193.tif", "AU31194.tif",
            "AU31201.tif", "AU31202.tif", "AU31203.tif", "AU31204.tif", "AU31211.tif", "AU31212.tif", "AU31213.tif",
            "AU31214.tif", "AU31221.tif", "AU31222.tif", "AU31223.tif", "AU31224.tif", "AU31231.tif", "AU31232.tif",
            "AU31233.tif", "AU31234.tif", "AU31241.tif", "AU31242.tif", "AU31243.tif", "AU31244.tif"
        ];

        // --- 1. BUILD CHECKBOX UI FOR ALL DEMs ---
        const container = document.getElementById('demListContainer');
        const countDisplay = document.getElementById('selectCount');

        myTifFiles.forEach((file, index) => {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'dem-item';
            
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.value = `Data/${file}`;
            checkbox.id = `dem_${index}`;

            const label = document.createElement('label');
            label.htmlFor = `dem_${index}`;
            label.innerText = file;

            itemDiv.appendChild(checkbox);
            itemDiv.appendChild(label);
            container.appendChild(itemDiv);

            checkbox.addEventListener('change', updateSelectionCount);
        });

        function updateSelectionCount() {
            const checked = container.querySelectorAll('input[type="checkbox"]:checked');
            countDisplay.innerText = `${checked.length} / 20 Selected`;

            // Enforce Maximum 20 Limit
            if (checked.length >= 20) {
                container.querySelectorAll('input[type="checkbox"]:not(:checked)').forEach(cb => {
                    cb.disabled = true;
                });
            } else {
                container.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                    cb.disabled = false;
                });
            }
        }

        // --- 2. THREE.JS SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); 
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.00004);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200000);
        camera.position.set(0, 5000, 5000);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.9);
        directionalLight.position.set(5000, 10000, 5000);
        scene.add(directionalLight);

        let currentMeshes = [];
        let basemapMesh = null;
        let isBasemapVisible = true;
        let currentBounds = null; // Store bounds of last loaded terrain

        const textureLoader = new THREE.TextureLoader();
        textureLoader.crossOrigin = "Anonymous";

        // --- 3. BASEMAP TOGGLE BUTTON CONTROL ---
        const basemapBtn = document.getElementById('basemapBtn');
        basemapBtn.addEventListener('click', () => {
            isBasemapVisible = !isBasemapVisible;
            if (isBasemapVisible) {
                basemapBtn.classList.remove('off');
                if (basemapMesh) basemapMesh.visible = true;
                else if (currentBounds) fetchAndRenderBasemap(currentBounds);
            } else {
                basemapBtn.classList.add('off');
                if (basemapMesh) basemapMesh.visible = false;
            }
        });

        // Function to fetch ESRI Satellite image specifically bounded for Peninsular Malaysia (EPSG:3375)
        function fetchAndRenderBasemap(bounds) {
            if (basemapMesh) {
                scene.remove(basemapMesh);
                basemapMesh.geometry.dispose();
                basemapMesh.material.dispose();
                basemapMesh = null;
            }

            // ESRI MapServer Export URL tuned for Peninsular Malaysia Grid (EPSG:3375)
            const esriUrl = `https://services.arcgisonline.com/arcgis/rest/services/World_Imagery/MapServer/export?bbox=${bounds.minX},${bounds.minY},${bounds.maxX},${bounds.maxY}&bboxSR=3375&imageSR=3375&size=2048,2048&format=jpg&f=image`;

            const baseWidth = bounds.maxX - bounds.minX;
            const baseHeight = bounds.maxY - bounds.minY;
            const basemapGeom = new THREE.PlaneGeometry(baseWidth, baseHeight);

            textureLoader.load(esriUrl, (texture) => {
                const basemapMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
                basemapMesh = new THREE.Mesh(basemapGeom, basemapMat);
                basemapMesh.rotation.x = -Math.PI / 2;
                
                basemapMesh.position.x = baseWidth / 2;
                basemapMesh.position.z = baseHeight / 2;
                basemapMesh.position.y = bounds.minZ - 1; // 1m below lowest terrain
                
                basemapMesh.visible = isBasemapVisible;
                scene.add(basemapMesh);
            });
        }

        // --- 4. RENDER 3D DEM TERRAIN ---
        async function loadSelectedDEMs() {
            const checkedBoxes = Array.from(container.querySelectorAll('input[type="checkbox"]:checked'));
            if (checkedBoxes.length === 0) {
                alert("Please check at least one DEM layer from the list.");
                return;
            }

            const selectedPaths = checkedBoxes.map(cb => cb.value);
            const loadingText = document.getElementById('loading');
            loadingText.style.display = 'block';

            try {
                // Remove old DEM meshes
                currentMeshes.forEach(mesh => { scene.remove(mesh); mesh.geometry.dispose(); mesh.material.dispose(); });
                currentMeshes = [];

                let loadedTiles = [];
                let globalMinZ = Infinity, globalMaxZ = -Infinity;
                let globalMinX = Infinity, globalMaxX = -Infinity;
                let globalMinY = Infinity, globalMaxY = -Infinity;

                // --- PASS 1: Calculate global bounding box & elevation extremes ---
                for (let k = 0; k < selectedPaths.length; k++) {
                    const response = await fetch(selectedPaths[k]);
                    const arrayBuffer = await response.arrayBuffer();
                    const tiff = await GeoTIFF.fromArrayBuffer(arrayBuffer);
                    const image = await tiff.getImage();
                    const rasters = await image.readRasters();
                    const elevationData = rasters[0]; 

                    const width = image.getWidth();
                    const height = image.getHeight();
                    const tiepoints = image.getTiePoints();
                    const pixelScale = image.getFileDirectory().ModelPixelScale;
                    
                    let originX = 0, originY = 0, scaleX = 1, scaleY = 1;
                    if (tiepoints && tiepoints.length > 0 && pixelScale) {
                        originX = tiepoints[0].x;
                        originY = tiepoints[0].y;
                        scaleX = pixelScale[0];
                        scaleY = pixelScale[1];
                    }

                    let tMinX = originX;
                    let tMaxX = originX + (width * scaleX);
                    let tMaxY = originY; 
                    let tMinY = originY - (height * scaleY);

                    if (tMinX < globalMinX) globalMinX = tMinX;
                    if (tMaxX > globalMaxX) globalMaxX = tMaxX;
                    if (tMinY < globalMinY) globalMinY = tMinY;
                    if (tMaxY > globalMaxY) globalMaxY = tMaxY;

                    for (let i = 0; i < elevationData.length; i++) {
                        let e = elevationData[i];
                        if (e > -1000) { 
                            if (e < globalMinZ) globalMinZ = e;
                            if (e > globalMaxZ) globalMaxZ = e;
                        }
                    }
                    loadedTiles.push({ elevationData, width, height, originX, originY, scaleX, scaleY });
                }

                currentBounds = { minX: globalMinX, maxX: globalMaxX, minY: globalMinY, maxY: globalMaxY, minZ: globalMinZ };

                // Load Satellite Basemap matching current DEM extent
                fetchAndRenderBasemap(currentBounds);

                // --- PASS 2: Construct 3D Tile Geometry ---
                for (let k = 0; k < loadedTiles.length; k++) {
                    const tile = loadedTiles[k];
                    
                    const geometry = new THREE.PlaneGeometry(tile.width * tile.scaleX, tile.height * tile.scaleY, tile.width - 1, tile.height - 1);
                    const vertices = geometry.attributes.position.array;
                    
                    const colors = [];
                    const color = new THREE.Color();

                    for (let i = 0, j = 0; i < vertices.length; i += 3, j++) {
                        let elevation = tile.elevationData[j];
                        if (elevation < -1000) elevation = globalMinZ; 
                        
                        vertices[i + 2] = elevation; // Height in meters

                        let normalizedHeight = (elevation - globalMinZ) / (globalMaxZ - globalMinZ);
                        if (isNaN(normalizedHeight)) normalizedHeight = 0;
                        
                        // Green to Red Color Ramp
                        color.setHSL((1.0 - normalizedHeight) * 0.33, 1.0, 0.5); 
                        colors.push(color.r, color.g, color.b);
                    }

                    geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
                    geometry.computeVertexNormals(); 

                    const material = new THREE.MeshStandardMaterial({ vertexColors: true, wireframe: false, side: THREE.DoubleSide });
                    const mesh = new THREE.Mesh(geometry, material);
                    mesh.rotation.x = -Math.PI / 2;

                    const xOffset = tile.originX - globalMinX;
                    const zOffset = globalMaxY - tile.originY; 
                    
                    mesh.position.x = xOffset + ((tile.width * tile.scaleX) / 2);
                    mesh.position.z = zOffset + ((tile.height * tile.scaleY) / 2); 

                    scene.add(mesh);
                    currentMeshes.push(mesh);
                }
                
                // Update Legend & Center Camera
                document.getElementById('legend').style.display = 'block';
                document.getElementById('maxElev').innerText = globalMaxZ.toFixed(1) + ' m';
                document.getElementById('minElev').innerText = globalMinZ.toFixed(1) + ' m';

                const baseWidth = globalMaxX - globalMinX;
                const baseHeight = globalMaxY - globalMinY;
                const targetX = baseWidth / 2;
                const targetZ = baseHeight / 2;
                
                controls.target.set(targetX, globalMinZ, targetZ);
                camera.position.set(targetX, Math.max(baseWidth, 4000) * 0.8, targetZ + Math.max(baseHeight, 4000) * 0.8);
                
                loadingText.style.display = 'none';
            } catch (error) {
                console.error("Error loading TIF:", error);
                loadingText.innerText = "Error loading DEM files.";
            }
        }

        document.getElementById('loadBtn').addEventListener('click', loadSelectedDEMs);

        // --- ANIMATION LOOP ---
        function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
        animate();

        window.addEventListener('resize', () => { 
            camera.aspect = window.innerWidth / window.innerHeight; 
            camera.updateProjectionMatrix(); 
            renderer.setSize(window.innerWidth, window.innerHeight); 
        });
    </script>
</body>
</html>
